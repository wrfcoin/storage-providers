name: Rust CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Gate negative controls
        run: bash scripts/ci-local.selftest.sh
      - name: Gate predicate controls
        run: bash scripts/workflow-gate.selftest.sh
      - name: Workspace gate
        run: bash scripts/ci-local.sh
  gate:
    # Read execution evidence for the substantive build in this run attempt.
    permissions:
      contents: read
      actions: read
    if: ${{ always() }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require successful build with executed steps
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = success
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > jobs.json
          jq -e -f scripts/workflow-gate.jq jobs.json
