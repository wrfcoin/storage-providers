name: Rust CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: [self-hosted, n5pro]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Gate negative controls
        run: bash scripts/ci-local.selftest.sh
      - name: Workspace gate
        run: bash scripts/ci-local.sh
  gate:
    if: ${{ always() }}
    needs: build
    runs-on: [self-hosted, n5pro]
    timeout-minutes: 5
    steps:
      - name: Require successful build with executed steps
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = success
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > jobs.json
          jq -e '[.jobs[] | select(.name == "build")] | length == 1 and all(.[]; .conclusion == "success" and (.steps | length) > 0 and .runner_name != "" and any(.steps[]; .name == "Workspace gate" and .conclusion == "success"))' jobs.json
