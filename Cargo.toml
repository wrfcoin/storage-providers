[workspace]
resolver = "2"
members = [
    "crates/storage-common",
    "crates/ipfs",
    "crates/filecoin",
    "crates/arweave",
    "crates/data-tiering",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/wrfcoin/storage-providers"

[workspace.dependencies]
wrfcoin-meteo-types = { path = "../meteo-types", package = "meteo-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"
lru = "0.12"
flate2 = "1"
blake3 = "1"
